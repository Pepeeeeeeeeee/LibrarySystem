version: "3.9"

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Student_1234
      POSTGRES_DB: pro5_db
    ports:
      - "5432:5432"  # host:container
    volumes:
      - pgdata:/var/lib/postgresql/data
#      - ./db/data.sql:/docker-entrypoint-initdb.d/data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pro5_db"]
      interval: 2s
      timeout: 3s
      retries: 15

  test_db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Student_1234
      POSTGRES_DB: pro5_db_test
    ports:
      - "5433:5432"  # host:container
    volumes:
      - pgdata_test:/var/lib/postgresql/data
#      - ./db/data.sql:/docker-entrypoint-initdb.d/data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pro5_db_test"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
  pgdata_test: