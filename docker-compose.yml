version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Student_1234}
      POSTGRES_DB: pro3_db
    ports:
      - "5432:5432"  # host:container
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/data.sql:/docker-entrypoint-initdb.d/data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pro3_db"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
