<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{books.title}">Library Home</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
</head>
<body class="overflow-hidden">
<div th:replace="~{fragments/header :: navbar(${userLoggedIn}, ${userPhotoUrl})}"></div>

<section class="vh-100 d-flex align-items-center justify-content-center text-center bg-dark text-white"
         style="background: url('/images/bookshelf.jpg') center/cover no-repeat;z-index: 0;">
    <div class="bg-dark bg-opacity-50 p-5 rounded">
        <h1 class="display-4 fw-bold mb-3" th:text="#{home.heading}"></h1>
        <p class="lead mb-4" th:text="#{home.content}"></p>
        <a th:href="@{/books}" class="btn btn-primary btn-lg px-4" th:text="#{home.button}"></a>
    </div>
</section>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
