<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title th:text="${book.title}">
        Book Details
    </title>

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>

<body>

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container mt-4">

    <div class="card shadow-sm border-0">

        <div class="row g-0">

            <div class="col-md-4 d-flex align-items-center justify-content-center bg-light">

                <img th:src="${book.coverImageUrl}"
                     class="img-fluid p-3 rounded"
                     th:alt="${book.title}">

            </div>

            <div class="col-md-8">

                <div class="card-body">

                    <div class="d-flex justify-content-between align-items-start">

                        <h2 class="card-title"
                            th:text="${book.title}">
                        </h2>

                        <span class="badge fs-6"
                              th:classappend="${isCheckedOut} ? 'bg-danger' : 'bg-success'"
                              th:text="${isCheckedOut} ? 'Checked Out' : 'Available'">
                        </span>

                    </div>

                    <div th:if="${book.comic}">

                        <p class="mt-2">

                            <strong>Artist:</strong>

                            <span th:text="${book.artist}"></span>

                        </p>

                    </div>

                    <p class="text-muted mt-3">

                        <strong>Author:</strong>
                        <span th:text="${book.author}"></span>

                        <br>

                        <strong>Genre:</strong>
                        <span th:text="${book.genre}"></span>

                        <br>

                        <strong>Pages:</strong>
                        <span th:text="${book.pages}"></span>

                        <br>

                        <strong>ISBN:</strong>
                        <span th:text="${book.isbn}"></span>

                        <br>

                        <strong>Location:</strong>
                        <span th:text="${book.location}"></span>

                    </p>

                    <div th:if="${isCheckedOut}">

                        <hr>

                        <p class="text-danger">

                            <i class="bi bi-clock-history"></i>

                            Expected return:
                            <span th:text="${expectedReturnDate}"></span>

                        </p>

                        <p>

                            <strong>Librarian:</strong>

                            <a th:href="@{'/librarians/' + ${librarianId}}"
                               th:text="${librarianName}">
                            </a>

                        </p>

                        <p>

                            <strong>Borrowed by:</strong>

                            <a th:href="@{'/profile/' + ${memberId}}"
                               th:text="${memberName}">
                            </a>

                        </p>

                    </div>

                    <div class="d-flex justify-content-between mt-4">

                        <a th:href="@{/books}"
                           class="btn btn-outline-primary">

                            <i class="bi bi-arrow-left"></i>

                            Back

                        </a>

                        <div class="d-flex gap-2"
                             sec:authorize="hasRole('ADMIN')">

                            <a th:href="@{'/books/edit/' + ${book.id}}"
                               class="btn btn-warning">

                                <i class="bi bi-pencil-square"></i>

                                Edit

                            </a>

                            <button type="button"
                                    class="btn btn-danger"
                                    data-bs-toggle="modal"
                                    data-bs-target="#confirmDeleteModal">

                                <i class="bi bi-trash"></i>

                                Delete

                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<div class="modal fade"
     id="confirmDeleteModal"
     tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Delete Book
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                Are you sure you want to delete:

                <strong th:text="${book.title}"></strong>

                ?

            </div>

            <div class="modal-footer">

                <button type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                    Cancel

                </button>

                <button type="button"
                        class="btn btn-danger"
                        id="confirmDeleteBtn">

                    Delete

                </button>

            </div>

        </div>

    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:inline="javascript">

    const bookId = [[${book.id}]];

    document.getElementById('confirmDeleteBtn')
        .addEventListener('click', async () => {

            const response = await fetch(`/api/books/${bookId}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                window.location.href = '/books';
            } else {
                alert('Failed to delete book');
            }
        });

</script>

<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
