<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'#{books.detail.title} - ' + ${book.title}">Book Details</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container mt-4">
    <div class="card shadow-sm border-0">
        <div class="row g-0">
            <div class="col-md-4 d-flex align-items-center justify-content-center bg-light">
                <img th:src="${book.coverImageUrl}" class="img-fluid p-3 rounded" th:alt="${book.title}" onerror="this.src='/images/books/default.jpg'">
            </div>
            <div class="col-md-8">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start">
                        <h2 class="card-title" th:text="${book.title}"></h2>
                        <span class="badge fs-6" th:classappend="${isCheckedOut} ? 'bg-danger' : 'bg-success'" th:text="${isCheckedOut} ? #{books.label.notAvailable} : #{books.label.available}"></span>
                    </div>

                    <p class="text-muted mt-1">
                        <strong th:text="#{books.field.author} + ':'"></strong> <span th:text="${book.author}"></span><br>
                        <strong th:text="#{books.field.genre} + ':'"></strong> <span th:text="${book.genre}"></span><br>
                        <strong th:text="#{books.field.pages} + ':'"></strong> <span th:text="${book.pages}"></span><br>
                        <strong th:text="#{books.field.isbn} + ':'"></strong> <span th:text="${book.isbn}"></span>
                    </p>

                    <div th:if="${isCheckedOut}">
                        <p class="mt-3 mb-0 text-danger">
                            <i class="bi bi-clock-history"></i>
                            <span th:text="#{checkouts.field.returnDate} + ':'"></span> <span th:text="${expectedReturnDate}"></span>
                        </p>
                    </div>

                    <a th:href="@{/books}" class="btn btn-outline-primary mt-4">
                        <i class="bi bi-arrow-left"></i> <span th:text="#{books.button.back}"></span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
