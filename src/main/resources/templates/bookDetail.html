<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'#{books.detail.title} - ' + ${book.title}">Book Details</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
<div th:replace="~{fragments/header :: navbar(${currentUser}, ${userPhotoUrl})}"></div>

<div class="container mt-4">
    <div class="card shadow-sm border-0">
        <div class="row g-0">
            <div class="col-md-4 d-flex align-items-center justify-content-center bg-light">
                <img th:src="${book.coverImageUrl}" class="img-fluid p-3 rounded" th:alt="${book.title}">
            </div>

            <div class="col-md-8">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start">
                        <h2 class="card-title" th:text="${book.title}"></h2>
                        <span class="badge fs-6"
                              th:classappend="${isCheckedOut} ? 'bg-danger' : 'bg-success'"
                              th:text="${isCheckedOut} ? #{books.label.notAvailable} : #{books.label.available}">
                        </span>
                    </div>

                    <p class="text-muted mt-1">
                        <strong th:text="#{books.field.author} + ':'"></strong> <span th:text="${book.author}"></span><br>
                        <strong th:text="#{books.field.genre} + ':'"></strong> <span th:text="${book.genre}"></span><br>
                        <strong th:text="#{books.field.pages} + ':'"></strong> <span th:text="${book.pages}"></span><br>
                        <strong th:text="#{books.field.isbn} + ':'"></strong> <span th:text="${book.isbn}"></span>
                    </p>

                    <div th:if="${isCheckedOut}">
                        <p class="mt-3 mb-2 text-danger">
                            <i class="bi bi-clock-history"></i>
                            <span th:text="#{checkouts.field.returnDate} + ':'"></span>
                            <span th:text="${expectedReturnDate}"></span>
                        </p>
                        <a class="mt-3 text-success text-decoration-none"
                           th:href="@{'/librarians/' + ${librarianId}}">
                            <i class="bi bi-bag-check"></i>
                            <span th:text="#{checkouts.field.handledBY} + ': '"></span>
                            <span th:text="${librarianName}"></span>
                        </a>
                        <p class="mt-2 mb-0 text-dark">
                            <i class="bi bi-person"></i>
                            <span th:text="#{checkouts.field.borrowedBy} + ': '"></span>
                            <span th:text="${memberName}" th:href="@{'/members/' + ${memberId}}"></span>
                        </p>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a th:href="@{/books}" class="btn btn-outline-primary mt-4">
                            <i class="bi bi-arrow-left"></i> <span th:text="#{books.button.back}"></span>
                        </a>

                        <div class="d-flex gap-2"
                             th:if="${currentUser != null and currentUser.flags.name() == 'ADMIN'}">

                            <a th:href="@{'/books/edit/' + ${book.id}}" class="btn btn-warning mt-4">
                                <i class="bi bi-pencil-square"></i> <span th:text="#{books.button.edit}">Edit</span>
                            </a>

                            <button type="button" class="btn btn-danger mt-4" data-bs-toggle="modal"
                                    data-bs-target="#confirmDeleteModal">
                                <i class="bi bi-trash"></i> <span th:text="#{books.button.delete}">Delete</span>
                            </button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" th:text="#{books.modal.deleteTitle}">Delete Book</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <p th:text="#{books.modal.deleteMessage}">Are you sure you want to delete this book?</p>
                <strong th:text="${book.title} + ' by ' + ${book.author}"></strong>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"
                        th:text="#{books.modal.cancel}">
                    Cancel
                </button>

                <a th:href="@{'/books/delete/' + ${book.id}}" class="btn btn-danger">
                    <span th:text="#{books.modal.confirmDelete}">Delete</span>
                </a>
            </div>

        </div>
    </div><
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
