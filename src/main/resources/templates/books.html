<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{books.title}">Books</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container mt-4">
    <h2 th:text="#{books.title}" class="mb-4"></h2>

    <div class="position-relative border border-light-subtle rounded-3 bg-white p-4 shadow-sm">
        <div th:replace="~{fragments/filter-bar :: filterBar(
            ${bookFields},
            ${selectedFields},
            ${query},
            @{/books/filter},
            ${currentUser != null and currentUser.membershipType.name() == 'ADMIN'},
            @{/books/add}
        )}"></div>

        <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4 mt-3">
            <div class="col" th:each="book : ${books}">
                <a th:href="@{'/books/' + ${book.id}}" class="text-decoration-none text-dark">
                    <div class="card h-100 border-light shadow-sm">
                        <img th:src="${book.coverImageUrl}" class="card-img-top" alt="" th:alt="${book.title}">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${book.title}"></h5>
                            <p class="card-text" th:text="${book.author}"></p>
                            <p class="text-muted mb-0" th:text="${book.genre}"></p>
                            <p class="text-muted mb-0" th:text="'ISBN: ' + ${book.isbn}"></p>
                        </div>
                    </div>
                </a>
            </div>
        </div>

        <nav th:if="${totalPages > 1}" class="mt-4">
            <ul class="pagination justify-content-center mb-0">
                <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                    <a class="page-link" th:href="@{'/books?page=' + (${currentPage} - 1)}">&laquo;</a>
                </li>
                <li class="page-item" th:each="pageNum : ${#numbers.sequence(1, totalPages)}"
                    th:classappend="${pageNum == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{'/books?page=' + ${pageNum}}" th:text="${pageNum}"></a>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                    <a class="page-link" th:href="@{'/books?page=' + (${currentPage} + 1)}">&raquo;</a>
                </li>
            </ul>
        </nav>

        <p class="mt-3 text-center small text-muted pb-4" th:text="#{books.total} + ${totalBooks}"></p>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
