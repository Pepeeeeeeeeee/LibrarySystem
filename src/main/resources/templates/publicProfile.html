<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>
        Public Profile
    </title>

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>

<body>

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container mt-4 pb-5">

    <h2 class="mb-4">
        Member Profile
    </h2>

    <div class="row mt-4">

        <div class="col-md-4 text-center">

            <img th:src="${profile.profileImageUrl}"
                 class="img-fluid rounded shadow mb-3"
                 style="max-width: 220px;"
                 alt="Profile Image">

            <h4 class="mt-3"
                th:text="${profile.firstName + ' ' + profile.lastName}">
            </h4>

            <p class="text-muted mb-1">

                <strong>
                    Member Since:
                </strong>

                <span th:text="${membershipDate}"></span>

            </p>

            <p class="text-muted">

                <strong>
                    Membership Type:
                </strong>

                <span th:text="${membershipType}"></span>

            </p>

        </div>

        <div class="col-md-8">

            <div class="card shadow-sm mb-4">

                <div class="card-header bg-primary text-white">

                    <h5 class="mb-0">
                        Contact Information
                    </h5>

                </div>

                <div class="card-body">

                    <div class="mb-3">

                        <label class="fw-bold">
                            Email
                        </label>

                        <p class="mb-0"
                           th:text="${profile.email}">
                        </p>

                    </div>

                    <div class="mb-3">

                        <label class="fw-bold">
                            Phone Number
                        </label>

                        <p class="mb-0"
                           th:text="${profile.phoneNumber}">
                        </p>

                    </div>

                    <div>

                        <label class="fw-bold">
                            Username
                        </label>

                        <p class="mb-0"
                           th:text="${profile.username}">
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <hr class="my-5">

    <div class="card shadow-sm border-0">

        <div class="card-body">

            <h3 class="mb-4">
                Checked Out Books
            </h3>

            <div id="checkoutContainer">

                <div class="text-center py-4">

                    <div class="spinner-border"></div>

                </div>

            </div>

        </div>

    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:inline="javascript">

    const memberId = [[${profile.id}]];

    async function loadCheckouts() {

        const container =
            document.getElementById('checkoutContainer');

        if (!container) {
            console.error('checkoutContainer not found');
            return;
        }

        try {

            const response =
                await fetch(`/api/members/${memberId}/checkouts`);

            if (!response.ok) {
                throw new Error();
            }

            const checkouts = await response.json();

            if (checkouts.length === 0) {

                container.innerHTML = `
                    <p class="text-muted mb-0">
                        No checked out books.
                    </p>
                `;

                return;
            }

            container.innerHTML = `
                <div class="table-responsive">

                    <table class="table align-middle">

                        <thead>

                            <tr>
                                <th>Book</th>
                                <th>Status</th>
                                <th>Checkout Date</th>
                                <th>Due Date</th>
                            </tr>

                        </thead>

                        <tbody>

                            ${checkouts.map(checkout => `
                                <tr>

                                    <td>
                                        <a href="/books/${checkout.bookId}">
                                            ${checkout.bookTitle}
                                        </a>
                                    </td>

                                    <td>
                                        ${checkout.status}
                                    </td>

                                    <td>
                                        ${checkout.checkoutDate ?? ''}
                                    </td>

                                    <td>
                                        ${checkout.dueDate ?? ''}
                                    </td>

                                </tr>
                            `).join('')}

                        </tbody>

                    </table>

                </div>
            `;

        } catch (e) {

            console.error(e);

            container.innerHTML = `
                <div class="alert alert-danger">
                    Failed to load checkouts.
                </div>
            `;
        }
    }

    loadCheckouts();

</script>

<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}">
</script>

</body>
</html>
