<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="en">

<head>

    <meta charset="UTF-8">

    <title>
        Membership Registration
    </title>

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>

<body class="bg-light">

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h3 class="card-title mb-4 text-center">
                        Complete Your Membership
                    </h3>

                    <form id="membershipCheckForm">

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Do you already have a membership?
                            </label>

                            <div class="form-check">

                                <input class="form-check-input"
                                       type="radio"
                                       name="hasMembership"
                                       id="hasYes"
                                       value="yes"
                                       onclick="toggleForms()">

                                <label class="form-check-label"
                                       for="hasYes">

                                    Yes

                                </label>

                            </div>

                            <div class="form-check">

                                <input class="form-check-input"
                                       type="radio"
                                       name="hasMembership"
                                       id="hasNo"
                                       value="no"
                                       onclick="toggleForms()">

                                <label class="form-check-label"
                                       for="hasNo">

                                    No

                                </label>

                            </div>

                        </div>

                    </form>

                    <form class="mt-4 d-none"
                          id="existingMemberForm">

                        <h5>
                            Existing Member
                        </h5>

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   class="form-control"
                                   id="existingEmail"
                                   required>

                        </div>

                        <button class="btn btn-primary w-100"
                                type="submit">

                            Submit

                        </button>

                    </form>

                    <form class="mt-4 d-none"
                          id="newMemberForm">

                        <h5>
                            New Membership
                        </h5>

                        <div class="mb-3">

                            <label class="form-label">
                                First Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="firstName"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Last Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="lastName"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Phone
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="phoneNumber"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Membership Type
                            </label>

                            <select id="membershipType"
                                    class="form-select">

                                <option value="STANDARD">
                                    STANDARD
                                </option>

                                <option value="PREMIUM">
                                    PREMIUM
                                </option>

                                <option value="STUDENT">
                                    STUDENT
                                </option>

                            </select>

                        </div>

                        <button class="btn btn-success w-100"
                                type="submit">

                            Submit

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>

    function toggleForms() {

        const yes = document.getElementById('hasYes').checked;

        const exist = document.getElementById("existingMemberForm");

        const fresh = document.getElementById("newMemberForm");

        exist.classList.add("d-none");
        fresh.classList.add("d-none");

        if (yes) {
            exist.classList.remove("d-none");
        } else {
            fresh.classList.remove("d-none");
        }
    }

    document.getElementById('existingMemberForm')
        .addEventListener('submit', async (e) => {

            e.preventDefault();

            const email = document.getElementById('existingEmail').value;

            const response = await fetch('/api/members/register/existing', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email })
            });

            if (response.ok) {
                window.location.href = '/login';
            } else {
                alert('Member not found');
            }
        });

    document.getElementById('newMemberForm')
        .addEventListener('submit', async (e) => {

            e.preventDefault();

            const body = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                phoneNumber: document.getElementById('phoneNumber').value,
                membershipType: document.getElementById('membershipType').value
            };

            const response = await fetch('/api/members/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });

            if (response.ok) {
                window.location.href = '/login';
            } else {
                alert('Failed to register member');
            }
        });

</script>

<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
