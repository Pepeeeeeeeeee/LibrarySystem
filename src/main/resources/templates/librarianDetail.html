<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title th:text="'Librarian Details - ' + ${librarian.firstName} + ' ' + ${librarian.lastName}">
        Librarian Details
    </title>

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>

<body>

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container mt-4 mb-5">

    <div class="card shadow-sm border-0">

        <div class="row g-0">

            <div class="col-md-4 d-flex align-items-center justify-content-center bg-light">

                <img th:src="${librarian.employeePhotoUrl}"
                     class="img-fluid p-3 rounded"
                     style="max-height: 500px; object-fit: cover;"
                     th:alt="${librarian.firstName + ' ' + librarian.lastName}">

            </div>

            <div class="col-md-8">

                <div class="card-body">

                    <div class="d-flex justify-content-between align-items-start">

                        <h2 class="card-title">

                            <span th:text="${librarian.firstName}"></span>
                            <span th:text="${librarian.lastName}"></span>

                        </h2>

                        <span class="badge fs-6"
                              th:classappend="${librarian.fullTime} ? 'bg-success' : 'bg-secondary'"
                              th:text="${librarian.fullTime} ? 'Full Time' : 'Part Time'">
                        </span>

                    </div>

                    <p class="text-muted mt-3">

                        <strong>Department:</strong>
                        <span th:text="${librarian.department}"></span>

                        <br>

                        <strong>Hire Date:</strong>
                        <span th:text="${librarian.hireDate}"></span>

                        <br>

                        <strong>Email:</strong>
                        <span th:text="${librarian.email}"></span>

                        <br>

                        <strong>Phone:</strong>
                        <span th:text="${librarian.phoneNumber}"></span>

                        <br>

                        <strong>Salary:</strong>
                        <span th:text="${librarian.salary}"></span>

                    </p>

                    <div class="d-flex justify-content-between mt-4">

                        <a th:href="@{/librarians}"
                           class="btn btn-outline-primary">

                            <i class="bi bi-arrow-left"></i>
                            Back

                        </a>

                        <div class="d-flex gap-2"
                             sec:authorize="hasRole('ADMIN')">

                            <a th:href="@{'/librarians/edit/' + ${librarian.id}}"
                               class="btn btn-warning">

                                <i class="bi bi-pencil-square"></i>
                                Edit

                            </a>

                            <button type="button"
                                    class="btn btn-danger"
                                    data-bs-toggle="modal"
                                    data-bs-target="#deleteModal">

                                <i class="bi bi-trash"></i>
                                Delete

                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <div class="card shadow-sm border-0 mt-4">

        <div class="card-body">

            <h4 class="mb-4">
                Books Processed By This Librarian
            </h4>

            <div id="checkoutContainer">

                <div class="text-center py-4">

                    <div class="spinner-border"></div>

                </div>

            </div>

        </div>

    </div>

</div>

<div class="modal fade"
     id="deleteModal"
     tabindex="-1"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Delete Librarian
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                Are you sure you want to delete this librarian?

            </div>

            <div class="modal-footer">

                <button type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                    Cancel

                </button>

                <button type="button"
                        class="btn btn-danger"
                        id="confirmDeleteBtn">

                    Delete

                </button>

            </div>

        </div>

    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>

    const librarianId = [[${librarian.id}]];

    async function loadCheckouts() {

        const container = document.getElementById('checkoutContainer');

        try {

            const response = await fetch(`/api/librarians/${librarianId}/checkouts`);

            if (!response.ok) {
                throw new Error();
            }

            const checkouts = await response.json();

            if (checkouts.length === 0) {

                container.innerHTML = `
                    <p class="text-muted mb-0">
                        No processed checkouts found.
                    </p>
                `;

                return;
            }

            container.innerHTML = `
                <div class="table-responsive">
                    <table class="table align-middle">

                        <thead>

                            <tr>
                                <th>Book</th>
                                <th>Member</th>
                                <th>Status</th>
                                <th>Checkout Date</th>
                            </tr>

                        </thead>

                        <tbody>

                            ${checkouts.map(checkout => `
                                <tr>

                                    <td>
                                        <a href="/books/${checkout.book.id}">
                                            ${checkout.book.title}
                                        </a>
                                    </td>

                                    <td>
                                        ${checkout.member.firstName} ${checkout.member.lastName}
                                    </td>

                                    <td>
                                        ${checkout.status}
                                    </td>

                                    <td>
                                        ${checkout.checkoutDate}
                                    </td>

                                </tr>
                            `).join('')}

                        </tbody>

                    </table>
                </div>
            `;

        } catch (e) {

            container.innerHTML = `
                <div class="alert alert-danger">
                    Failed to load checkouts.
                </div>
            `;
        }
    }

    document.getElementById('confirmDeleteBtn')
        ?.addEventListener('click', async () => {

            const response = await fetch(`/api/librarians/${librarianId}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                window.location.href = '/librarians';
            } else {
                alert('Failed to delete librarian');
            }
        });

    loadCheckouts();

</script>

<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
