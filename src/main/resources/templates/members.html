<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{members.title}">Members</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container mt-4">
    <h2 th:text="#{members.title}" class="mb-4"></h2>

    <div class="position-relative border border-light-subtle rounded-3 bg-white p-4 shadow-sm">
        <div th:replace="~{fragments/filter-bar :: filterBar(
            ${memberFields},
            ${selectedFields},
            ${query},
            @{/members/filter},
            true,
            @{/members/add}
        )}"></div>

        <div class="table-responsive mt-3">
            <table class="table align-middle">
                <tbody>
                <tr th:each="member : ${members}">
                    <td class="col-1 text-center">
                        <img th:src="${member.profileImageUrl}" class="rounded-circle border" style="width:60px; height:60px; object-fit:cover;" th:alt="${member.firstName + ' ' + member.lastName}">
                    </td>
                    <td class="col-8">
                        <strong th:text="${member.firstName + ' ' + member.lastName}"></strong><br>
                        <small class="text-muted" th:text="${member.email}"></small>
                    </td>
                    <td class="col-3 text-end">
                        <div class="d-flex justify-content-end gap-1">
                            <span class="badge bg-secondary" th:text="${member.membershipType}"></span>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <nav th:if="${totalPages > 1}" class="mt-4">
            <ul class="pagination justify-content-center mb-0">
                <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                    <a class="page-link" th:href="@{'/members?page=' + (${currentPage} - 1)}">&laquo;</a>
                </li>
                <li class="page-item" th:each="pageNum : ${#numbers.sequence(1, totalPages)}" th:classappend="${pageNum == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{'/members?page=' + ${pageNum}}" th:text="${pageNum}"></a>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                    <a class="page-link" th:href="@{'/members?page=' + (${currentPage} + 1)}">&raquo;</a>
                </li>
            </ul>
        </nav>

        <p class="mt-3 text-center small text-muted pb-4" th:text="#{members.total} + ${totalMembers}"></p>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
