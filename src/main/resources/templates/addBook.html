<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="#{books.add.title}">Add Book</title>

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body class="bg-light">

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container mt-5 mb-5">

    <h2 class="mb-4 text-center"
        th:text="#{books.add.title}">
    </h2>

    <div class="border border-light-subtle rounded-3 bg-white p-4 shadow-sm position-relative">

        <div class="position-absolute top-0 end-0 mt-3 me-3">
            <a th:href="@{/books}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i>
                <span th:text="#{books.button.back}"></span>
            </a>
        </div>

        <form id="addBookForm" class="mt-4">

            <div class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">ISBN</label>
                    <input type="text" id="isbn" class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Title</label>
                    <input type="text" id="title" class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Author</label>
                    <input type="text" id="author" class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Publication Date</label>
                    <input type="date" id="publicationDate" class="form-control">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Pages</label>
                    <input type="number" id="pages" class="form-control">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Price</label>
                    <input type="number" id="price" step="0.01" class="form-control">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Genre</label>

                    <select id="genre" class="form-select">
                        <option value="FICTION">FICTION</option>
                        <option value="FANTASY">FANTASY</option>
                        <option value="SCIENCE">SCIENCE</option>
                        <option value="BIOGRAPHY">BIOGRAPHY</option>
                        <option value="MYSTERY">MYSTERY</option>
                        <option value="HORROR">HORROR</option>
                        <option value="HISTORY">HISTORY</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Cover Image URL</label>
                    <input type="url" id="coverImageUrl" class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Location</label>
                    <input type="text" id="location" class="form-control">
                </div>

                <div class="col-md-6">
                    <div class="form-check form-switch mt-4">
                        <input class="form-check-input"
                               type="checkbox"
                               id="available"
                               checked>

                        <label class="form-check-label">
                            Available
                        </label>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-check form-switch mt-4">
                        <input class="form-check-input"
                               type="checkbox"
                               id="comicToggle">

                        <label class="form-check-label">
                            Comic
                        </label>
                    </div>
                </div>

                <div class="col-md-6 d-none" id="artistContainer">
                    <label class="form-label">Artist</label>
                    <input type="text" id="artist" class="form-control">
                </div>

            </div>

            <div class="mt-4 text-center">
                <button type="submit" class="btn btn-primary px-4">
                    <i class="bi bi-check-circle"></i>
                    Save
                </button>
            </div>

        </form>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    const comicToggle = document.getElementById('comicToggle');
    const artistContainer = document.getElementById('artistContainer');

    comicToggle.addEventListener('change', () => {
        artistContainer.classList.toggle('d-none', !comicToggle.checked);
    });

    document.getElementById('addBookForm')
        .addEventListener('submit', async (e) => {

            e.preventDefault();

            const body = {
                isbn: document.getElementById('isbn').value,
                title: document.getElementById('title').value,
                author: document.getElementById('author').value,
                publicationDate: document.getElementById('publicationDate').value,
                pages: parseInt(document.getElementById('pages').value),
                price: parseFloat(document.getElementById('price').value),
                genre: document.getElementById('genre').value,
                available: document.getElementById('available').checked,
                coverImageUrl: document.getElementById('coverImageUrl').value,
                location: document.getElementById('location').value,
                comic: document.getElementById('comicToggle').checked,
                artist: document.getElementById('artist').value
            };

            const response = await fetch('/api/books', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });

            if (response.ok) {
                window.location.href = '/books';
            } else {
                alert('Failed to create book');
            }
        });
</script>

<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
