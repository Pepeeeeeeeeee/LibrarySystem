<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{books.add.title}">Add Book</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container mt-5 mb-5">
    <h2 class="mb-4 text-center" th:text="#{books.add.title}"></h2>

    <div class="border border-light-subtle rounded-3 bg-white p-4 shadow-sm position-relative">

        <div class="position-absolute top-0 end-0 mt-3 me-3">
            <a th:href="@{/books}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> <span th:text="#{books.button.back}"></span>
            </a>
        </div>

        <form th:action="@{/books/add}" method="post" class="mt-4">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="isbn" class="form-label" th:text="#{books.field.isbn}"></label>
                    <input type="text" id="isbn" name="isbn" class="form-control" placeholder="978-..." required>
                </div>

                <div class="col-md-6">
                    <label for="title" class="form-label" th:text="#{books.title}"></label>
                    <input type="text" id="title" name="title" class="form-control" placeholder="" required>
                </div>

                <div class="col-md-6">
                    <label for="author" class="form-label" th:text="#{books.field.author}"></label>
                    <input type="text" id="author" name="author" class="form-control" placeholder="" required>
                </div>

                <div class="col-md-6">
                    <label for="publicationDate" class="form-label" th:text="#{books.field.publicationDate}"></label>
                    <input type="date" id="publicationDate" name="publicationDate" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label for="pages" class="form-label" th:text="#{books.field.pages}"></label>
                    <input type="number" id="pages" name="pages" class="form-control" min="1" placeholder="" required>
                </div>

                <div class="col-md-4">
                    <label for="price" class="form-label" th:text="#{books.field.price}"></label>
                    <input type="number" id="price" name="price" step="0.01" min="0" class="form-control" placeholder="" required>
                </div>

                <div class="col-md-4">
                    <label for="genre" class="form-label" th:text="#{books.label.selectGenre}"></label>
                    <select id="genre" name="genre" class="form-select" required>
                        <option value="" disabled selected th:text="#{books.field.genre}"></option>
                        <option th:each="g : ${T(be.kdg.programming3.domain.enums.Genre).values()}"
                                th:value="${g}" th:text="${g}"></option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label d-block" th:text="#{books.field.available}"></label>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="isAvailable" name="isAvailable" checked>
                        <label class="form-check-label" for="isAvailable" th:text="#{books.label.available}"></label>
                    </div>
                </div>

                <div class="col-md-6">
                    <label for="coverImageUrl" class="form-label" th:text="#{books.field.coverImageUrl}"></label>
                    <input type="url" id="coverImageUrl" name="coverImageUrl" class="form-control" placeholder="">
                </div>

                <div class="col-12">
                    <label for="location" class="form-label" th:text="#{books.label.location}"></label>
                    <input type="text" id="location" name="location" class="form-control" placeholder="">
                </div>
            </div>

            <div class="mt-4 text-center">
                <button type="submit" class="btn btn-primary px-4">
                    <i class="bi bi-check-circle"></i> <span th:text="#{books.button.save}"></span>
                </button>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
