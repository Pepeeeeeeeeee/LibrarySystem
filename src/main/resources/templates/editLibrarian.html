<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{librarians.edit.title}">Edit Librarian</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div th:replace="~{fragments/header :: navbar(${currentUser}, ${userPhotoUrl})}"></div>

<div class="container mt-5 mb-5">
    <h2 class="mb-4 text-center" th:text="#{librarians.edit.title}">Edit Librarian</h2>

    <div class="border border-light-subtle rounded-3 bg-white p-4 shadow-sm position-relative">

        <div class="position-absolute top-0 end-0 mt-3 me-3">
            <a th:href="@{/librarians}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> <span th:text="#{librarians.button.back}"></span>
            </a>
        </div>

        <form th:action="@{|/librarians/edit/${librarian.id}|}" th:object="${librarian}" method="post" class="mt-4">
            <div class="row g-3">

                <div class="col-md-6">
                    <label for="firstName" class="form-label" th:text="#{librarians.field.firstName}"></label>
                    <input type="text" id="firstName" th:field="*{firstName}" class="form-control">
                    <div class="text-danger small" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                </div>

                <div class="col-md-6">
                    <label for="lastName" class="form-label" th:text="#{librarians.field.lastName}"></label>
                    <input type="text" id="lastName" th:field="*{lastName}" class="form-control">
                    <div class="text-danger small" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                </div>

                <div class="col-md-6">
                    <label for="department" class="form-label" th:text="#{librarians.field.department}"></label>
                    <input type="text" id="department" th:field="*{department}" class="form-control">
                    <div class="text-danger small" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
                </div>

                <div class="col-md-6">
                    <label for="hireDate" class="form-label" th:text="#{librarians.field.hireDate}"></label>
                    <input type="date" id="hireDate" th:field="*{hireDate}" class="form-control">
                    <div class="text-danger small" th:if="${#fields.hasErrors('hireDate')}" th:errors="*{hireDate}"></div>
                </div>

                <div class="col-md-6">
                    <label for="email" class="form-label" th:text="#{librarians.field.email}"></label>
                    <input type="email" id="email" th:field="*{email}" class="form-control">
                    <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="col-md-6">
                    <label for="phoneNumber" class="form-label" th:text="#{librarians.field.phone}"></label>
                    <input type="text" id="phoneNumber" th:field="*{phoneNumber}" class="form-control">
                    <div class="text-danger small" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label d-block" th:text="#{librarians.field.fullTime}"></label>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" th:field="*{fullTime}">
                        <label class="form-check-label" for="fullTime" th:text="#{librarians.label.fullTime}"></label>
                    </div>
                </div>

                <div class="col-md-6">
                    <label for="salary" class="form-label" th:text="#{librarians.field.salary}"></label>
                    <input type="number" id="salary" th:field="*{salary}" step="0.01" min="0" class="form-control">
                    <div class="text-danger small" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
                </div>

                <div class="col-md-6">
                    <label for="employeePhotoUrl" class="form-label" th:text="#{librarians.field.photo}"></label>
                    <input type="url" id="employeePhotoUrl" th:field="*{employeePhotoUrl}" class="form-control">
                    <div class="text-danger small" th:if="${#fields.hasErrors('employeePhotoUrl')}" th:errors="*{employeePhotoUrl}"></div>
                </div>

            </div>

            <div class="mt-4 text-center">
                <button type="submit" class="btn btn-primary px-4">
                    <i class="bi bi-check-circle"></i> <span th:text="#{librarians.button.save}"></span>
                </button>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
