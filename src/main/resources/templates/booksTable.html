<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{books.title}">All Books</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container mt-4">
    <h2 th:text="#{books.table.heading}">All Books Attributes</h2>

    <div class="border border-light-subtle rounded-3 bg-white p-4 shadow-sm">
        <div th:replace="~{fragments/filter-bar :: filterBar(
            ${bookFields}, ${selectedFields}, ${query}, @{/books/filter}, true, @{/books/add}
        )}"></div>

        <div class="table-responsive mt-3">
            <table class="table table-bordered table-sm">
                <thead>
                <tr>
                    <th th:text="#{books.field.id}">ID</th>
                    <th th:text="#{books.field.isbn}">ISBN</th>
                    <th th:text="#{books.field.title}">Title</th>
                    <th th:text="#{books.field.author}">Author</th>
                    <th th:text="#{books.field.publicationDate}">Publication Date</th>
                    <th th:text="#{books.field.pages}">Pages</th>
                    <th th:text="#{books.field.price}">Price</th>
                    <th th:text="#{books.field.genre}">Genre</th>
                    <th th:text="#{books.field.available}">Available</th>
                    <th th:text="#{books.field.coverImageUrl}">Cover URL</th>
                    <th th:text="#{books.field.location}">Location</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="book : ${books}">
                    <td th:text="${book.id}"></td>
                    <td th:text="${book.isbn}"></td>
                    <td th:text="${book.title}"></td>
                    <td th:text="${book.author}"></td>
                    <td th:text="${book.publicationDate}"></td>
                    <td th:text="${book.pages}"></td>
                    <td th:text="${book.price}"></td>
                    <td th:text="${book.genre}"></td>
                    <td th:text="${book.available}"></td>
                    <td th:text="${book.coverImageUrl}"></td>
                    <td th:text="${book.location}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
