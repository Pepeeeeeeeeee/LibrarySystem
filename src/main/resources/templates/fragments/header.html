<div th:fragment="navbar(currentUser, userPhotoUrl)">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid d-flex justify-content-between align-items-center">

            <a class="navbar-brand me-auto" th:href="@{/}">
                <img th:src="@{/images/logo.png}" alt="Library Logo" height="32" class="me-2">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav" aria-controls="navbarNav"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" th:href="@{/books}" th:text="#{nav.books}"></a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/librarians}" th:text="#{nav.librarians}"></a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/members}" th:text="#{nav.members}"></a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/about}" th:text="#{nav.about}"></a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/contact}" th:text="#{nav.contact}"></a></li>
                </ul>
            </div>

            <div class="d-flex ms-auto align-items-center">
                <div th:if="not ${currentUser ?: null}">
                    <a class="btn btn-outline-light me-2" th:href="@{/register}" th:text="#{nav.register}"></a>
                    <a class="btn btn-outline-light" th:href="@{/login}" th:text="#{nav.login}"></a>
                </div>

                <div th:if="${currentUser != null}" class="dropdown z-3">
                    <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        <img th:src="${userPhotoUrl}" alt="Profile" class="rounded-circle border border-light"
                             style="width:36px; height:36px;">
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                        <li><a class="dropdown-item" th:href="@{/profile}" th:text="#{nav.profile}"></a></li>
                        <li><a class="dropdown-item" th:href="@{/logout}" th:text="#{nav.logout}"></a></li>
                    </ul>
                </div>
            </div>

        </div>
    </nav>
</div>
